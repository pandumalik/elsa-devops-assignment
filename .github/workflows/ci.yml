name: CI — Test, SAST, Build, Scan & Sign

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/quote-api

jobs:
  unit-test:
    name: Unit Tests (Node 24)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: part-1-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: part-1-service/package-lock.json

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts

      - name: Run unit test suite (hard-failing gate)
        run: npm test

  sast-semgrep:
    name: SAST Quality Gate (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.96.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Semgrep SAST scan (hard-fails on any finding)
        run: |
          semgrep scan \
            --config p/nodejs \
            --config p/dockerfile \
            --config .semgrep.yml \
            --error \
            part-1-service/ part-2-gitops/

  build-scan-push:
    name: Build, Trivy Gate, Push & Cosign Sign
    runs-on: ubuntu-latest
    needs: [unit-test, sast-semgrep]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Derive immutable Git SHA tags
        id: vars
        run: |
          echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image_repo=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build distroless image (loaded locally for scanning)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./part-1-service
          load: true
          tags: |
            ${{ steps.vars.outputs.image_repo }}:${{ steps.vars.outputs.sha_tag }}
            ${{ steps.vars.outputs.image_repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability gate (HIGH/CRITICAL hard-fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.image_repo }}:${{ steps.vars.outputs.sha_tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the exact image that passed the scan
        if: github.event_name != 'pull_request'
        id: push
        env:
          IMAGE_REPO: ${{ steps.vars.outputs.image_repo }}
          SHA_TAG: ${{ steps.vars.outputs.sha_tag }}
        run: |
          docker push --all-tags "$IMAGE_REPO"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REPO:$SHA_TAG" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign for keyless OIDC signing
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign container image digest with Cosign (Keyless OIDC)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REPO: ${{ steps.vars.outputs.image_repo }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REPO@$DIGEST"
