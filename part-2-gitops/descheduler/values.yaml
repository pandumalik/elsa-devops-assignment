kind: Deployment
deschedulingInterval: 30s

deschedulerPolicyAPIVersion: "descheduler/v1alpha2"
deschedulerPolicy:
  profiles:
    - name: quote-api-spread
      pluginConfig:
        - name: DefaultEvictor
          args:
            podProtections:
              defaultDisabled:
                - PodsWithLocalStorage
        - name: RemovePodsViolatingTopologySpreadConstraint
          args:
            constraints:
              - DoNotSchedule
            namespaces:
              include:
                - quote-api
      plugins:
        balance:
          enabled:
            - RemovePodsViolatingTopologySpreadConstraint

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
